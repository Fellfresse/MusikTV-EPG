name: Bau 8H Teil

on:
  repository_dispatch:
    types:
      - 8-H
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get current date
        id: date
        run: echo "RUN_DATE=$(date +'%Y-%m-%d  %H:%M UTC')" >> $GITHUB_ENV

      - name: checkout repo content
        uses: actions/checkout@v4

      - name: pull changes
        run: |
          git pull

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      - name: generate Rakuten NL[light] EPG
        run: python generate_rakuten_nl[light].py --out epg_Rakuten_NL[light].xml
  
      - name: generate Rakuten DE[light] EPG
        run: python generate_rakuten_de[light].py --out epg_Rakuten_DE[light].xml

      - name: generate Zattoo AT[light] EPG
        run: python generate_zattoo_at[light].py --out epg_Zattoo_AT[light].xml

      - name: generate Zattoo CH[light] EPG
        run: python generate_zattoo_ch[light].py --out epg_Zattoo_CH[light].xml

      - name: generate Open DE[light] EPG
        run: python generate_open_de[light].py --out epg_OpenDE[light].xml

      - name: generate Open FR[light] EPG
        run: python generate_open_fr[light].py --out epg_OpenFR[light].xml

      - name: generate Plex Fellfresse[light] EPG
        run: python generate_plex.fellfresse[light].py --out epg_Plex.fellfresse[light].xml

      - name: generate EPGSHARE CA[light] EPG
        run: python generate_epgshare_ca[light].py --out epg_Share_CA[light].xml

      - name: generate Musikbox[light] EPG
        run: python generate_musikbox[light].py --out epg_Musikbox[light].xml

      - name: generate Vantage[light] EPG
        run: python generate_vantage[light].py --out epg_Vantage[light].xml

      - name: commit files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff-index --quiet HEAD || (git commit -a -m "Updated EPG listings on $RUN_DATE" --allow-empty)

      - name: push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: master
