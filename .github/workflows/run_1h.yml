name: MusikTV EPG

on:
  repository_dispatch:
    types:
      - 1-H
  # 'push:' entfernt, um die Endlosschleife zwischen 1H, 2H und 8H zu stoppen

permissions:
  contents: write  # Erlaubt dem Workflow das Pushen der EPG-Datei

concurrency:
  group: epg-repo-push  # Gleiche Gruppe wie 2-H und 8-H -> verhindert Push-Konflikte
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get current date
        id: date
        run: echo "RUN_DATE=$(date +'%Y-%m-%d  %H:%M UTC')" >> $GITHUB_ENV

      - name: checkout repo content
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Falls nötig, hier einkommentieren:
      # - name: Install dependencies
      #   run: pip install -r requirements.txt

      - name: generate EPG_MusikTV
        run: python generate_musicTV_epg.py

      - name: commit files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff-index --quiet HEAD || git commit -m "Updated EPG listings on $RUN_DATE"

      - name: push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: master
