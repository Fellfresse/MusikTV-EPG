name: MusikTV EPG

on:
  repository_dispatch:
    types:
      - 1-H
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: epg-repo-push
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get current date
        id: date
        run: echo "RUN_DATE=$(TZ='Europe/Berlin' date +'%d-%m-%Y  %H:%M MEZ')" >> $GITHUB_ENV

      - name: checkout repo content
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: generate EPG_MusikTV
        run: python generate_musicTV_epg.py

      - name: commit and push files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          if ! git diff-index --quiet HEAD; then
            git commit -m "EPG Update am $RUN_DATE"
            git push
          fi
