name: Build EPG

on:
  repository_dispatch:
    types:
      - webhook-1
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get current date
        id: date
        run: echo "RUN_DATE=$(date +'%Y-%m-%d  %H:%M UTC')" >> $GITHUB_ENV

      - name: checkout repo content
        uses: actions/checkout@v4

      - name: pull changes
        run: |
          git pull

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

#      - name: generate Samsung[light] EPG
#        run: python generate_samsung[light].py

      - name: generate Pluto GB[light] EPG
        run: python generate_pluto_gblight].py --hours 48 --out epg_Pluto_GB[light].xml

      - name: generate Pluto CA[light] EPG
        run: python generate_pluto_ca[light].py --hours 48 --out epg_Pluto_CA[light].xml

      - name: generate Pluto BR[light] EPG
        run: python generate_pluto_br[light].py --hours 48 --out epg_Pluto_BR[light].xml
 
      - name: generate Pluto US[light] EPG
        run: python generate_pluto_us[light].py --hours 48 --out epg_Pluto_US[light].xml
 
      - name: commit files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff-index --quiet HEAD || (git commit -a -m "Updated EPG listings on $RUN_DATE" --allow-empty)

      - name: push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: master
