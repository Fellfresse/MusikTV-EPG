name: Bau 2H Teil

on:
  repository_dispatch:
    types:
      - 2-H
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: epg-repo-push
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get current date
        id: date
        run: echo "RUN_DATE=$(TZ='Europe/Berlin' date +'%d-%m-%Y  %H:%M MEZ')" >> $GITHUB_ENV

      - name: checkout repo content
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: generate Pluto GB[light] EPG
        run: python "generate_pluto_gb[light].py" --hours 48 --out "epg_Pluto_GB[light].xml"

      - name: generate Pluto CA[light] EPG
        run: python "generate_pluto_ca[light].py" --hours 48 --out "epg_Pluto_CA[light].xml"

      - name: generate Pluto BR[light] EPG
        run: python "generate_pluto_br[light].py" --hours 48 --out "epg_Pluto_BR[light].xml"
 
      - name: generate Pluto US[light] EPG
        run: python "generate_pluto_us[light].py" --hours 48 --out "epg_Pluto_US[light].xml"
 
      - name: generate Plex.buddy_chew_chew[light] EPG
        run: python "generate_plex.buddy_chew_chew[light].py" --out "epg_Plex_BuddyChewChew[light].xml"

      - name: commit and push files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          if ! git diff-index --quiet HEAD; then
            git commit -m "EPG Update am $RUN_DATE"
            git push
          fi
